<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1021"/>
      <stop offset="50%" stop-color="#111A36"/>
      <stop offset="100%" stop-color="#091326"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#5AC8FA"/>
    </linearGradient>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="ring2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F0A"/>
      <stop offset="100%" stop-color="#FF375F"/>
    </linearGradient>
    <linearGradient id="ring3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF5AF2"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
  </g>

  <!-- Left Content: App Icon + Title + Badges -->
  <g transform="translate(72, 74)">
    <!-- App Icon Box -->
    <rect x="0" y="0" width="76" height="76" rx="20" fill="url(#iconGrad)" filter="url(#glow)"/>
    <rect x="0" y="0" width="76" height="76" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
    <!-- Sparkles Icon -->
    <path d="M38 16 L43 31 L58 36 L43 41 L38 56 L33 41 L18 36 L33 31 Z" fill="#ffffff"/>
    <circle cx="55" cy="21" r="3.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="22" cy="52" r="2.5" fill="#ffffff" opacity="0.8"/>

    <!-- Badge -->
    <rect x="96" y="8" width="230" height="28" rx="14" fill="#0A84FF" fill-opacity="0.18" stroke="#5AC8FA" stroke-opacity="0.4"/>
    <text x="112" y="26" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="700" fill="#5AC8FA" letter-spacing="1.2">NATIVE MACOS SWIFTUI APP</text>

    <!-- Title -->
    <text x="96" y="68" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', sans-serif" font-size="44" font-weight="800" fill="#ffffff">MeuCleaner</text>

    <!-- Subtitle -->
    <text x="0" y="124" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="20" font-weight="400" fill="#A5B4FC">
      Limpador nativo para macOS: varredura inteligente, Space Lens em anéis,
    </text>
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="20" font-weight="400" fill="#A5B4FC">
      desinstalador completo, restos da Library e agente na barra de menus.
    </text>

    <!-- Channel Pills -->
    <g transform="translate(0, 188)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">
      <rect x="0" y="0" width="136" height="34" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="16" y="22" fill="#5AC8FA">00 · Smart Scan</text>

      <rect x="148" y="0" width="144" height="34" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="164" y="22" fill="#FF9F0A">01 · System Junk</text>

      <rect x="304" y="0" width="138" height="34" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="320" y="22" fill="#64D2FF">02 · Space Lens</text>

      <rect x="454" y="0" width="138" height="34" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="470" y="22" fill="#FF453A">04 · Uninstaller</text>

      <rect x="0" y="44" width="136" height="34" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="16" y="66" fill="#BF5AF2">03 · Large &amp; Old</text>

      <rect x="148" y="44" width="144" height="34" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="164" y="66" fill="#5E5CE6">05 · Leftovers</text>

      <rect x="304" y="44" width="138" height="34" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="320" y="66" fill="#FF375F">06 · Safe Trash</text>

      <rect x="454" y="44" width="138" height="34" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="470" y="66" fill="#30D158">07 · App Updater</text>
    </g>
  </g>

  <!-- Right Graphic: Space Lens Concentric Rings Illustration -->
  <g transform="translate(955, 210)">
    <circle r="150" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="24"/>
    <circle r="112" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="30"/>

    <!-- Inner Ring Segments -->
    <circle r="112" fill="none" stroke="url(#ring1)" stroke-width="30" stroke-dasharray="310 700" stroke-dashoffset="0" transform="rotate(-90)"/>
    <circle r="112" fill="none" stroke="url(#ring2)" stroke-width="30" stroke-dasharray="190 700" stroke-dashoffset="-322" transform="rotate(-90)"/>
    <circle r="112" fill="none" stroke="url(#ring3)" stroke-width="30" stroke-dasharray="155 700" stroke-dashoffset="-524" transform="rotate(-90)"/>

    <!-- Outer Ring Segments -->
    <circle r="150" fill="none" stroke="#5AC8FA" stroke-opacity="0.75" stroke-width="22" stroke-dasharray="220 950" stroke-dashoffset="0" transform="rotate(-90)"/>
    <circle r="150" fill="none" stroke="#0A84FF" stroke-opacity="0.65" stroke-width="22" stroke-dasharray="160 950" stroke-dashoffset="-232" transform="rotate(-90)"/>
    <circle r="150" fill="none" stroke="#FF9F0A" stroke-opacity="0.75" stroke-width="22" stroke-dasharray="210 950" stroke-dashoffset="-410" transform="rotate(-90)"/>
    <circle r="150" fill="none" stroke="#BF5AF2" stroke-opacity="0.7" stroke-width="22" stroke-dasharray="180 950" stroke-dashoffset="-635" transform="rotate(-90)"/>

    <!-- Center Readout -->
    <text x="0" y="-22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1.5">LIMPEZA SEGURA</text>
    <text x="0" y="12" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', sans-serif" font-size="34" font-weight="800" fill="#5AC8FA">24,8 GB</text>
    <text x="0" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#30D158">✓ Lixeira por padrão</text>
  </g>
</svg>
